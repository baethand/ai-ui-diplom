<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../styles/styles.css">

    <!-- Font Awesome (иконки) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- Навигационная панель -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <!-- Логотип и бренд -->
            <a class="navbar-brand" href="#">
                <i class="fas fa-robot me-2"></i>
                AI ImageGen
            </a>

            <!-- Кнопка для мобильного меню -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Основное меню -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            <i class="fas fa-home me-1"></i>Главная
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Правая часть (переключатель темы + кнопка входа) -->
            <div class="d-flex align-items-center ">
                <!-- Переключатель темы -->
                <div class="form-check form-switch me-3">
                    <input class="form-check-input" type="checkbox" id="themeSwitch" aria-label="Переключить тему">
                    <label class="form-check-label text-light" for="themeSwitch">
                        <i class="fas fa-moon"></i>
                    </label>
                </div>

                <h5 class="mb-0" id="user-username">Username</h5>
                <button id="logout-btn" class="btn ">
                    Выйти
                </button>
            </div>
        </div>
    </nav>

    <main class="container-fluid my-4">
        <div class="row g-4 justify-content-center mt-5">
            <!-- Генератор -->
            <div class="col-lg-3">
                <form class="card shadow h-100 p-3" id="generateForm">
                    <!-- ... Форма генерации изображения ... -->
                    <div class="mb-3">
                        <label for="prompt" class="form-label">Описание изображения</label>
                        <textarea class="form-control" id="prompt" rows="3" placeholder="Введите описание изображения..." required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="model" class="form-label">Модель</label>
                        <select class="form-select" id="model" required>
                            <option value="" disabled selected>Загрузка моделей...</option>
                        </select>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="numSteps" class="form-label">Количество шагов</label>
                            <input type="number" class="form-control" id="numSteps" min="10" max="100" value="50"
                                required>
                        </div>
                        <div class="col-md-6">
                            <label for="guidance" class="form-label">Guidance Scale</label>
                            <input type="number" step="0.5" class="form-control" id="guidance" min="1" max="20"
                                value="12.0" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="width" class="form-label">Ширина</label>
                            <input type="number" class="form-control" id="width" min="256" max="1024" value="512"
                                required>
                        </div>
                        <div class="col-md-6">
                            <label for="height" class="form-label">Высота</label>
                            <input type="number" class="form-control" id="height" min="256" max="1024" value="512"
                                required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2" id="sendToGenerate" >
                        <span id="submitText">Сгенерировать изображение</span>
                        <span class="spinner-border spinner-border-sm d-none" id="spinner" role="status"></span>
                    </button>
                </form>
            </div>

            <!-- Галерея -->
            <div class="col-lg-7">
                <div class="card shadow h-100">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0"><i class="fas fa-images me-2"></i>Мои работы</h4>
                    </div>
                    <div class="card-body">
                        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="imageGrid">
                            <!-- Карточки -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="notificationToast" class="toast" role="alert">
            <div class="toast-header bg-success text-white">
                <strong class="me-auto">Уведомление</strong>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastMessage">
                Изображение сгенерировано!
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/script.js"></script>
    <script src="../scripts/authChecker.js"></script>
</body>

</html>
