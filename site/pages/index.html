<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ImageGen — Главная</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom styles -->
    <link href="styles.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(-45deg, #6a11cb, #2575fc, #43e97b, #38f9d7);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            text-align: center;
            flex-direction: column;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .big-heading {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 2rem;
            color: aliceblue;
        }

        .btn-group-home .btn {
            min-width: 150px;
            margin: 0 10px;
        }
    </style>
</head>
<body>

    <h1 class="big-heading">Давай начнем создавать!</h1>

    <div class="btn-group-home d-flex justify-content-center">
        <button class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#loginModal">
            <i class="fas fa-sign-in-alt me-2"></i> Войти
        </button>
        <button class="btn btn-light" data-bs-toggle="modal" data-bs-target="#registerModal">
            <i class="fas fa-user-plus me-2"></i> Регистрация
        </button>
    </div>

    <!-- Подключаем модалки -->
    <div id="modals-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Подгружаем модалки из отдельного HTML файла
        fetch('../modules/modals.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('modals-container').innerHTML = html;
            });
    </script>
</body>
</html>
